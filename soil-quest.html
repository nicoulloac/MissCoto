<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Soil Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a soil cross-section. Sky and grass on top, missions dug into layers that get deeper (and harder) as you go down. Single bright look by choice. */
:root{
  color-scheme: light;
  --sky:#CDEBF7; --sky2:#9ED6EE; --grass:#3E9B34; --sprout:#6CCB4B;
  --o:#2C1C12; --a:#4A2E1C; --b:#8A4F2C; --c:#9A8A7A; --r:#5B5652;
  --paper:#FFFCF4; --paper2:#F6EEDD; --ink:#2A1B12; --ink2:#6B5848; --line:#E2D5BE;
  --sun:#FFC43D; --worm:#F07C98; --wormdark:#C9566F;
  --ok:#23944A; --okbg:#DDF3E3; --bad:#D33A3F; --badbg:#FBE1E1; --info:#2F6FD1;
  --k1:#E0474C; --k2:#2F72D8; --k3:#E8A400; --k4:#2B9A4E;
  --display:"Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --shadow:0 3px 0 rgba(42,27,18,.18);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--o);color:#FFF6E6;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--display);font-size:24px;font-weight:800;color:#FFF6E6}
.brand svg{width:34px;height:34px}
.chips{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:18px;height:18px}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;color:#FFF6E6}
.iconbtn svg{width:22px;height:22px}
.progress{background:var(--a);color:#F3E3C8}
.progress .wrap{display:flex;align-items:center;gap:10px;padding-block:6px;font-size:14px}
.pbar{flex:1;height:12px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sprout),var(--sun));border-radius:999px;transition:width .6s}

main{padding-block:18px 48px}
.screen{animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:999px;border:0;font-family:var(--display);font-weight:700;font-size:20px;background:var(--grass);color:#fff;box-shadow:0 4px 0 #2B6E25;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2B6E25}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #C99000}
.btn.small{min-height:42px;font-size:17px;padding:6px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--ink2)}

/* Panels */
.panel{background:var(--paper);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.stack{display:grid;gap:14px}
.howto{background:var(--paper2);border-radius:var(--r-md);padding:12px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.howto svg{flex:none;width:28px;height:28px}
.tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* Welcome */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.hero-sky{background:linear-gradient(var(--sky2),var(--sky));padding:26px 22px 0;position:relative}
.hero h1{font-size:clamp(46px,11vw,84px);color:var(--o);letter-spacing:-.01em}
.hero p.lead{font-size:19px;max-width:30ch;margin:6px 0 0}
.hero-sky .tag{display:block;padding-right:84px}
.sunball{position:absolute;right:22px;top:18px;width:64px;height:64px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,196,61,.25)}
.grassline{height:18px;background:var(--grass);margin-top:22px;position:relative}
.grassline:before{content:"";position:absolute;left:0;right:0;top:-8px;height:10px;background:radial-gradient(circle at 6px 10px,var(--grass) 6px,transparent 7px) 0 0/12px 10px repeat-x}
.layers > div{padding:14px 22px;color:#FFF3E0;font-size:16px;display:flex;gap:12px;align-items:center}
.layers b{font-family:var(--display);font-size:22px;width:28px}
.hero .worm{position:absolute;right:20px;bottom:14px;width:110px;height:auto}
.hero .grassline{margin-top:70px}
.goal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.goal div{background:var(--paper2);border-radius:var(--r-md);padding:12px 14px;font-size:16px}
.goal strong{display:block;font-family:var(--display);font-size:20px}

/* Mission map */
.map{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.band{padding:16px;color:#FFF3E0}
.band h2{font-size:26px}
.band .sub{font-size:15px;opacity:.85;margin:2px 0 12px}
.band.l1{background:var(--a)}
.band.l2{background:var(--b)}
.band.l3{background:var(--c);color:var(--ink)}
.band.l4{background:var(--r)}
.band.sky{background:linear-gradient(var(--sky2),var(--sky));color:var(--ink);padding-bottom:26px;position:relative}
.band.sky:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--grass)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:var(--r-md);padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);min-height:84px;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--paper2)}
.tile .ic svg{width:34px;height:34px}
.tile .tt{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.tile .td{font-size:14px;color:var(--ink2)}
.tile .stars{display:flex;gap:2px;margin-top:3px}
.tile .stars svg{width:18px;height:18px}
.tile.locked{opacity:.55;filter:grayscale(.6)}
.tile.done .ic{background:var(--okbg)}
.boss-tile{background:#2E2A27;color:#FFF3E0}
.boss-tile .td{color:#D9CBB8}
.lockmsg{font-size:14px;margin-top:10px;opacity:.9}

/* Mission screen */
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mhead h2{font-size:30px;flex:1;min-width:0}
.counter{font-weight:600;font-variant-numeric:tabular-nums;background:var(--paper);border-radius:999px;padding:6px 12px;font-size:15px}
.qcard{background:var(--paper);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.qtext{font-size:21px;font-weight:500;line-height:1.4;margin:0 0 14px}
.fig{display:flex;justify-content:center;margin:0 0 14px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:10px 14px;border-radius:var(--r-md);border:3px solid var(--line);background:#fff;font-size:18px;transition:transform .08s}
.opt:hover{border-color:var(--ink2)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--paper2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.opts.kahoot{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts.kahoot{grid-template-columns:1fr}}
.kahoot .opt{border:0;color:#fff;font-weight:600;min-height:72px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.kahoot .opt .k{background:rgba(255,255,255,.25)}
.kahoot .opt.c0{background:var(--k1)} .kahoot .opt.c1{background:var(--k2)} .kahoot .opt.c2{background:var(--k3);color:#2A1B12} .kahoot .opt.c3{background:var(--k4)}
.kahoot .opt.dim{opacity:.35}
.kahoot .opt.right{outline:5px solid var(--ink);outline-offset:-5px;opacity:1}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tf .opt{overflow-wrap:anywhere;text-align:center}
.counter:empty{display:none}
@media (max-width:440px){.brand-text{display:none}.chip{font-size:14px;padding:3px 8px}.iconbtn{width:36px;height:36px}.topbar .wrap{flex-wrap:nowrap;gap:6px}.chips{gap:4px;flex-wrap:nowrap}#lo .opt{font-size:18px!important}}
.tf .opt{justify-content:center;font-family:var(--display);font-size:26px;font-weight:800;min-height:80px}
.feedback{margin-top:14px;border-radius:var(--r-md);padding:14px 16px;font-size:17px;display:grid;gap:10px}
.feedback.ok{background:var(--okbg);border:2px solid var(--ok)}
.feedback.no{background:var(--badbg);border:2px solid var(--bad)}
.feedback b.v{font-family:var(--display);font-size:22px}
.timer{height:10px;border-radius:999px;background:var(--paper2);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--info);width:100%;transition:width .25s linear}
.timer.low i{background:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}

/* Matching */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mcard{width:100%;min-width:0;overflow-wrap:anywhere;hyphens:auto;min-height:60px;padding:10px 12px;border-radius:var(--r-md);border:3px solid var(--line);background:#fff;text-align:left;font-size:16px;line-height:1.3}
.mcard.term{font-family:var(--display);font-weight:700;font-size:19px}
@media (max-width:480px){.match{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px}.mcard{font-size:14.5px;padding:8px}.mcard.term{font-size:16px}}
.mcard.sel{border-color:var(--info);background:#E4EEFC}
.mcard.done{border-color:var(--ok);background:var(--okbg);cursor:default}
.mcard.done .pairno{display:inline-grid}
.pairno{display:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;place-items:center;font-size:13px;font-weight:700;margin-right:6px;vertical-align:middle}

/* Gaps */
.passage{font-size:19px;line-height:2.2}
.gap{display:inline-block;min-width:120px;min-height:38px;padding:2px 12px;margin:0 2px;border-radius:10px;border:3px dashed var(--ink2);background:#fff;font-weight:600;line-height:1.5;vertical-align:middle}
.gap.sel{border-style:solid;border-color:var(--info);background:#E4EEFC}
.gap.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.gap.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;background:var(--paper2);border-radius:var(--r-md)}
.word{border:0;border-radius:999px;padding:8px 16px;background:var(--a);color:#FFF3E0;font-weight:600;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.word.used{opacity:.3}

/* Order */
.olist{display:grid;gap:8px;counter-reset:o}
.oitem{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:var(--r-md);padding:8px 8px 8px 12px}
.oitem .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.oitem .tx{flex:1;min-width:0;font-size:17px}
.oitem .mv{display:flex;flex-direction:column;gap:4px}
.oitem .mv button{width:40px;height:34px;border-radius:8px;border:0;background:var(--paper2);display:grid;place-items:center}
.oitem .mv button svg{width:18px;height:18px}
.oitem.right{border-color:var(--ok);background:var(--okbg)}
.oitem.wrong{border-color:var(--bad);background:var(--badbg)}
.oitem .lab{font-family:var(--display);font-weight:800;color:var(--b);margin-right:4px}

/* Sort */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:var(--r-md);background:var(--paper2)}
.card{border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:16px;text-align:left;user-select:none}
.card.sel{border-color:var(--info);background:#E4EEFC;transform:scale(1.04)}
.card.right{border-color:var(--ok);background:var(--okbg);cursor:default}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:520px){.bins{grid-template-columns:1fr}}
.bin{border:3px dashed var(--ink2);border-radius:var(--r-md);padding:10px;min-height:150px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:8px;text-align:left}
.bin h3{font-size:21px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin.hot{border-style:solid;border-color:var(--info);background:#E4EEFC}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9}

/* Word search */
.ws{display:grid;gap:3px;margin:0 auto;max-width:520px;user-select:none;touch-action:manipulation}
.ws button{aspect-ratio:1;max-width:100%;border:0;border-radius:6px;background:#fff;font-family:var(--display);font-weight:700;font-size:clamp(14px,4vw,22px);padding:0;display:grid;place-items:center;text-transform:uppercase}
.ws button.start{background:var(--sun)}
.ws button.found{background:var(--sprout);color:#fff}
.ws button.hint{background:#FFE7A3}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wlist span{padding:4px 10px;border-radius:999px;background:var(--paper2);font-weight:600;font-size:15px}
.wlist span.f{background:var(--okbg);color:var(--ok);text-decoration:line-through}

/* Race */
.track{position:relative;height:96px;border-radius:var(--r-md);background:repeating-linear-gradient(90deg,#8A4F2C 0 8%,#7A4527 8% 16%);margin-bottom:14px;overflow:hidden}
.track .lane{position:absolute;left:8px;right:40px;height:40px}
.track .lane.l1{top:6px}.track .lane.l2{top:50px}
.track .runner{position:absolute;top:0;width:44px;height:40px;transition:left .5s;transform:translateX(-50%)}
.track .finish{position:absolute;right:0;top:0;bottom:0;width:32px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/16px 16px}
.track .lbl{position:absolute;left:8px;font-size:12px;color:#FFE9C9;font-weight:600}

/* Boss */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:linear-gradient(#E7C9A0,#C99A68);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.fighter{text-align:center}
.fighter svg{width:min(120px,26vw);height:auto}
.hp{height:14px;border-radius:999px;background:rgba(0,0,0,.2);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.hearts{display:flex;justify-content:center;gap:4px;margin-top:6px}
.hearts svg{width:26px;height:26px}
.vs{font-family:var(--display);font-weight:800;font-size:30px;color:var(--o)}
.hit{animation:hit .4s}
@keyframes hit{30%{transform:translateX(10px) rotate(4deg);filter:brightness(1.6)}}

/* Results */
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--paper2);border-radius:var(--r-md);padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--ink2)}
.topicrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
@media (max-width:480px){.topicrow{grid-template-columns:minmax(0,1fr) 70px 44px}}
.tbar{height:12px;background:var(--paper2);border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%}
.pct{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:8px;align-items:center;background:var(--paper2);border-radius:var(--r-md);padding:8px 10px;font-size:14px;line-height:1.25}
.badge svg{flex:none;width:38px;height:38px}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge b{display:block;font-size:15px}
.review{background:#FFF4D6;border:2px solid var(--sun);border-radius:var(--r-md);padding:12px 14px}
.review ul{margin:6px 0 0;padding-left:20px}
.stars-big{display:flex;justify-content:center;gap:6px}
.stars-big svg{width:56px;height:56px}

/* Notebook */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{background:#fff;border-radius:var(--r-md);padding:14px 16px;border-top:8px solid var(--b);font-size:16px}
.note h3{font-size:22px;margin-bottom:6px}
.note ul{margin:0;padding-left:18px}

/* Toast + modal */
#toast{pointer-events:none;opacity:0;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(140%);background:var(--o);color:#FFF6E6;border-radius:999px;padding:10px 18px;font-weight:600;z-index:50;transition:transform .3s;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast svg{width:24px;height:24px;flex:none}
.modal{position:fixed;inset:0;background:rgba(42,27,18,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal .panel{max-width:440px;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch{width:58px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--grass)}
.switch[aria-checked="true"]:after{left:30px}
.mhead .ic svg{width:32px;height:32px}
.band.sky svg{width:100%;height:auto}
.track .runner svg{width:100%;height:100%}
.legend{font-size:14px;color:var(--ink2);margin:-6px 0 12px}
.dtable{border-collapse:collapse;font-size:16px;background:#fff;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:2px solid var(--line);padding:6px 14px;text-align:center}
.dtable th{background:var(--paper2);font-weight:600}
</style>
</head><body>

<header class="topbar"><div class="wrap">
  <button class="brand" id="homeBtn" aria-label="Back to mission map"><span id="brandWorm"></span><span class="brand-text">Soil Quest</span></button>

// Soil horizons diagram. arrow = layer letter to point at; labels = show letters.
function horizonsSVG(arrow, labels){
 const L=[["O",20,"#2C1C12"],["A",48,"#4A2E1C"],["E",30,"#D8C3A0"],["B",52,"#9C5A32"],["C",52,"#A99A86"],["R",48,"#6B6560"]];
 const x0=30,w=220,r=rng(7);let y=72,out="",mid={};
 L.forEach(([k,h,c])=>{
  out+=`<rect x="${x0}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  if(k==="O"){for(let i=0;i<14;i++)out+=`<ellipse cx="${x0+8+i*15.5}" cy="${y+8+r()*6}" rx="6" ry="2.5" fill="${i%2?'#6B8F2E':'#8A5A2A'}" transform="rotate(${r()*60-30} ${x0+8+i*15.5} ${y+10})"/>`;}
  if(k==="A"){for(let i=0;i<40;i++)out+=`<circle cx="${x0+5+r()*(w-10)}" cy="${y+5+r()*(h-10)}" r="${1+r()*1.6}" fill="#2A170C"/>`;}
  if(k==="E"){for(let i=0;i<18;i++)out+=`<circle cx="${x0+5+r()*(w-10)}" cy="${y+4+r()*(h-8)}" r="1.4" fill="#B79F7A"/>`;}
  if(k==="B"){for(let i=0;i<9;i++)out+=`<ellipse cx="${x0+15+r()*(w-30)}" cy="${y+10+r()*(h-20)}" rx="${5+r()*5}" ry="${3+r()*3}" fill="#B9774A"/>`;}
  if(k==="C"){for(let i=0;i<16;i++){const cx=x0+10+r()*(w-20),cy=y+8+r()*(h-16),s=5+r()*7;out+=`<path d="M${cx-s} ${cy} L${cx-s/3} ${cy-s*.8} L${cx+s} ${cy-s/3} L${cx+s*.6} ${cy+s*.7} L${cx-s*.4} ${cy+s*.6}Z" fill="#7F7466" stroke="#5E554A" stroke-width="1"/>`;}}
  if(k==="R"){out+=`<path d="M${x0+20} ${y+12}l40 6 30-4M${x0+120} ${y+30}l35-8 40 6M${x0+40} ${y+38}l30-6M${x0+150} ${y+12}l20 10" stroke="#3F3B38" stroke-width="2" fill="none" stroke-linecap="round"/>`;}
  mid[k]=y+h/2;
  if(labels){out+=`<path d="M${x0+w+4} ${y+h/2}h10" stroke="#2A1B12" stroke-width="2"/><text x="${x0+w+20}" y="${y+h/2+6}" font-family="Arial" font-weight="700" font-size="17" fill="#2A1B12">${k}</text>`;}
  y+=h;
 });
 // plant + roots
 let p=`<path d="M140 72V22" stroke="#2B6E25" stroke-width="4"/>`;
 [[30,1],[40,-1],[50,1],[60,-1]].forEach(([yy,s])=>p+=`<ellipse cx="${140+s*14}" cy="${yy}" rx="14" ry="6" fill="#3E9B34" transform="rotate(${s*-25} ${140+s*14} ${yy})"/>`);
 p+=`<path d="M140 72c0 30-14 45-24 80M140 72c4 30 20 40 28 70M140 72v95M132 100c-10 6-20 6-30 14M150 110c10 4 22 4 30 14" stroke="#E9D8B6" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 p+=`<path d="M60 72c-2-10 4-10 2-18M64 72c2-8 8-8 8-14M210 72c-2-10 5-10 3-17M214 72c2-8 8-8 8-12" stroke="#3E9B34" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 let a="";
 if(arrow&&mid[arrow]!==undefined){const ax=labels?296:262;a=`<path d="M352 ${mid[arrow]}H${ax+12}" stroke="#D33A3F" stroke-width="5" stroke-linecap="round"/><path d="M${ax} ${mid[arrow]}l16-10v20z" fill="#D33A3F"/>`;}
 return `<svg viewBox="0 0 360 332" width="360" role="img" aria-label="Diagram of soil horizons${arrow?' with an arrow pointing at one layer':''}"><rect x="0" y="0" width="360" height="332" fill="#FFFFFF" fill-opacity="0"/>${out}${p}${a}</svg>`;
}

// ---------- M3 WORD SEARCH ----------
function buildGrid(words,N,seed){
 for(let s=seed;s<seed+500;s++){
  const r=rng(s);const g=Array.from({length:N},()=>Array(N).fill(""));const pos={};let ok=true;
  const dirs=[[0,1],[1,0],[1,1],[-1,1]];
  for(const w of words.slice().sort((a,b)=>b.length-a.length)){
   let placed=false;
   for(let tries=0;tries<300&&!placed;tries++){
    const[dr,dc]=dirs[Math.floor(r()*dirs.length)];const r0=Math.floor(r()*N),c0=Math.floor(r()*N);
    const re=r0+dr*(w.length-1),ce=c0+dc*(w.length-1);if(re<0||re>=N||ce<0||ce>=N)continue;
    let fit=true;for(let i=0;i<w.length;i++){const ch=g[r0+dr*i][c0+dc*i];if(ch&&ch!==w[i]){fit=false;break}}
    if(!fit)continue;for(let i=0;i<w.length;i++)g[r0+dr*i][c0+dc*i]=w[i];pos[w]={r0,c0,dr,dc};placed=true;}
   if(!placed){ok=false;break}}
  if(!ok)continue;
  const AB="ABCDEFGHIJKLMNOPRSTUVWY";for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!g[i][j])g[i][j]=AB[Math.floor(r()*AB.length)];
  return{g,pos};}
}
function mSearch(el,m){
 const run=newRun(m);const N=12;const words=WORDS.map(w=>w.w);
 const{g,pos}=buildGrid(words,N,Math.floor(Math.random()*1000));
 const found=new Set();let start=null,hints=0;
 el.innerHTML=mhead(m,`0/${words.length}`)+howto("Tap the FIRST letter of a word, then tap its LAST letter. Words go across, down or diagonally.")+
 `<div class="qcard" style="margin-top:14px"><div class="ws" id="ws" style="grid-template-columns:repeat(${N},1fr)"></div>
 <div class="wlist" id="wl"></div><div class="row" style="margin-top:14px"><button class="btn small alt" id="hintBtn">Hint</button><button class="btn small" id="doneBtn">Finish</button></div></div>`;
 const ws=$("#ws",el);
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const b=document.createElement("button");b.textContent=g[i][j];b.dataset.r=i;b.dataset.c=j;b.setAttribute("aria-label",`Row ${i+1}, column ${j+1}, letter ${g[i][j]}`);ws.appendChild(b)}
 const cell=(r,c)=>ws.children[r*N+c];

  let txt="",cells=[];if(straight)for(let i=0;i<len;i++){const rr=start.r+dr*i,cc=start.c+dc*i;txt+=g[rr][cc];cells.push(cell(rr,cc))}
  const rev=txt.split("").reverse().join("");const w=words.find(x=>!found.has(x)&&(x===txt||x===rev));

  if(w&&len>1){found.add(w);cells.forEach(x=>{x.classList.add("found");x.classList.remove("hint")});const pts=50+(S.streak>=3?10:0);S.score+=pts;save();hud();run.points+=pts;beep("ok");
   toast(`<b>${w}</b>: ${WORDS.find(x=>x.w===w).d}`);list();if(found.size===words.length){award("words");setTimeout(finish,900)}}
  else{b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);beep("no");toast("That is not one of the words. Try again!")}
 };

  words.forEach((w,wi)=>w.onclick=()=>{if(fill.includes(wi))return;if(selG===null||locked.has(selG)){selG=fill.findIndex((f,i)=>f===null&&!locked.has(i));if(selG<0)return}

   }else{gaps.forEach((g,i)=>{if(!locked.has(i))fill[i]=null});selG=fill.findIndex(f=>f===null);paint();gaps.forEach((g,i)=>{if(!locked.has(i))g.classList.add("wrong")});

  <div class="statgrid"><div class="stat"><div class="v">${S.score}</div><div class="l">points</div></div><div class="stat"><div class="v">${S.correct}</div><div class="l">correct answers</div></div><div class="stat"><div class="v">${S.wrong}</div><div class="l">mistakes</div></div><div class="stat"><div class="v">${acc}%</div><div class="l">accuracy</div></div><div class="stat"><div class="v">${totalStars()}/30</div><div class="l">stars</div></div><div class="stat"><div class="v">${S.best}</div><div class="l">best streak</div></div></div></div>
  <div class="panel"><h2 style="font-size:26px;margin-bottom:6px">How you did in each topic</h2>
  ${rows.map(r=>{const col=r.p===null?"var(--line)":r.p>=80?"var(--ok)":r.p>=60?"var(--sun)":"var(--bad)";return `<div class="topicrow"><span>${TOPICS[r.t].name}</span><span class="tbar"><i style="width:${r.p||0}%;background:${col}"></i></span><span class="pct">${r.p===null?"–":r.p+"%"}</span></div>`}).join("")}
  ${weak.length||todo.length?`<div class="review" style="margin-top:14px"><b>Topics to review before the test</b><ul>${weak.map(r=>`<li><b>${TOPICS[r.t].name}</b> (${r.p}%): ${TOPICS[r.t].tip}</li>`).join("")}${todo.map(r=>`<li><b>${TOPICS[r.t].name}</b>: not practised yet.</li>`).join("")}</ul></div>`:`<div class="feedback ok" style="margin-top:14px"><b class="v">You are ready!</b><div>All your topics are at 70% or more. Keep reviewing your mistakes.</div></div>`}
  </div>
  <div class="panel"><h2 style="font-size:26px;margin-bottom:10px">Badges</h2><div class="badges">${BADGES.map((b,i)=>`<div class="badge ${S.badges.includes(b.id)?"":"off"}">${badgeSVG(i)}<span><b>${b.n}</b>${b.d}</span></div>`).join("")}</div></div>
  <div class="row" style="margin-top:16px"><button class="btn sun" id="revBtn">Review mistakes (${Object.keys(S.missed).length})</button><button class="btn alt" id="nbBtn">Soil Notebook</button><button class="btn" id="mapBtn">Mission map</button></div>`;
 $("#revBtn",el).onclick=()=>go(reviewMode,null);$("#nbBtn",el).onclick=()=>go(notebook);$("#mapBtn",el).onclick=()=>go(mapScreen);
}

// ---------- SETTINGS ----------
function settings(){
 const md=$("#modal");md.hidden=false;
 const sw=(id,on,label,sub)=>`<div class="setrow"><div><b>${label}</b><div class="muted" style="font-size:14px">${sub}</div></div><button class="switch" id="${id}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;
 md.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="Settings"><h2 style="font-size:28px;margin-bottom:6px">Settings</h2>
  ${sw("swT",S.settings.timers,"Timers","Turn off to play without time limits.")}
  ${sw("swS",S.settings.sound,"Sound","Sound effects for answers.")}
  ${sw("swU",S.settings.unlock,"Open all missions","For teachers: play any mission without unlocking.")}
  <div class="setrow"><div><b>Start over</b><div class="muted" style="font-size:14px">Erase points, stars and badges on this device.</div></div><button class="btn small alt" id="rst">Erase</button></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn small" id="cls">Close</button></div></div>`;
 const tog=(id,key)=>{$("#"+id).onclick=e=>{S.settings[key]=!S.settings[key];e.currentTarget.setAttribute("aria-checked",S.settings[key]);save();hud()}};
 tog("swT","timers");tog("swS","sound");tog("swU","unlock");
 $("#rst").onclick=e=>{const b=e.currentTarget;if(b.dataset.c){const keep=S.settings;S=fresh();S.settings=keep;save();md.hidden=true;go(welcome)}else{b.dataset.c="1";b.textContent="Yes, erase";b.style.background="var(--bad)";b.style.color="#fff"}};
 $("#cls").onclick=()=>{md.hidden=true;if($(".map"))go(mapScreen)};
 md.onclick=e=>{if(e.target===md){md.hidden=true;if($(".map"))go(mapScreen)}};
}

// ---------- boot ----------
$("#brandWorm").innerHTML=wormSVG().replace("<svg","<svg width=\"34\" height=\"22\"");
$("#icoPts").innerHTML=IC.pts;$("#icoStar").innerHTML=IC.star(true);$("#icoFire").innerHTML=IC.fire;$("#setBtn").innerHTML=IC.gear;
$("#homeBtn").onclick=()=>go(mapScreen);
$("#soundBtn").onclick=()=>{S.settings.sound=!S.settings.sound;save();hud();beep("tap")};
$("#setBtn").onclick=settings;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden){$("#modal").hidden=true}});
go(welcome);
</script></body></html>
